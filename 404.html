<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Página não disponível</title>
<!-- Página de erro do domínio (status 404). Só as cinco rotas vendem (/bio/, /sdr/, /tfg/, /story/, /cht/): a raiz,
     o /index.html e qualquer endereço que não exista caem aqui (ver o .htaccess e o _redirects). Sem botão de
     compra e sem rastreio (sem GTM e sem pixel). Todo arquivo é pedido a partir da raiz (/assets/...,
     /favicon...), para a página abrir inteira em qualquer profundidade de endereço. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0B0607">
<meta name="color-scheme" content="dark">
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/geist-latin.woff2" crossorigin>
<style>
@font-face{font-family:'Geist';font-style:normal;font-weight:100 900;font-display:swap;src:url(/assets/fonts/geist-latin.woff2) format('woff2')}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* Fundo da página (vinho escuro puxado para o preto, os mesmos valores do brilho do fechamento do index.html), com o grão por cima. */
body{margin:0;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:48px max(22px,env(safe-area-inset-right)) 48px max(22px,env(safe-area-inset-left));font-family:'Geist',system-ui,sans-serif;text-align:center;color:#FFFFFF;background:radial-gradient(ellipse 70% 55% at 50% 42%,#2A040E 0%,#140609 55%,#0B0607 100%) #0B0607;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background-image:url(/assets/img/grain.png);background-image:image-set(url(/assets/img/opt/grain.webp) type("image/webp"),url(/assets/img/grain.png) type("image/png"));background-size:180px;opacity:.5;mix-blend-mode:overlay}
main{display:flex;flex-direction:column;align-items:center;gap:28px;max-width:30rem}
.escudo{width:56px;height:auto;filter:drop-shadow(0 0 26px rgba(224,24,90,.4))}
h1{margin:0;font-weight:600;font-size:clamp(26px,6.4vw,36px);line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
/* Link discreto: texto de apoio sublinhado, sem cara de botão. */
a{display:inline-flex;align-items:center;min-height:44px;font-size:15px;color:#C5B9BB;text-decoration:underline;text-decoration-color:rgba(197,185,187,.4);text-underline-offset:4px}
a:hover{color:#FFFFFF;text-decoration-color:currentColor}
a:focus-visible{outline:2px solid #E9C27A;outline-offset:3px;border-radius:4px}
</style>
</head>
<body>
<main>
<svg class="escudo" width="56" height="67" viewBox="0 0 200 240" aria-hidden="true"><defs><linearGradient id="escudo-ouro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4DDA6"/><stop offset="1" stop-color="#B98A3E"/></linearGradient></defs><path d="M100 10 L182 40 C182 120 158 182 100 230 C42 182 18 120 18 40 Z" fill="url(#escudo-ouro)"/></svg>
<h1>Esta página não está disponível.</h1>
<a href="https://www.instagram.com/marcellopgomes/">@marcellopgomes no Instagram</a>
</main>
</body>
</html>
